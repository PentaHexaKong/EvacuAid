services:
  dashboard:
    build:
      context: ./testocando/mapshit
    environment:
      BACKEND_URL: http://backend:8000
      COMMAND_API_KEY: ${COMMAND_API_KEY:-}
      VALHALLA_URL: http://valhalla:8002
      DASHBOARD_HOME: 'true'
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-evacuaid}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-evacuaid}
      REDIS_URL: redis://redis:6379/0
      COMMAND_API_KEY: ${COMMAND_API_KEY:-}
      VALHALLA_URL: ${VALHALLA_URL:-http://valhalla:8002}
      ALERT_PUSH_ENABLED: ${ALERT_PUSH_ENABLED:-true}
      PYTHONPATH: /app:/app/testocando
    command: ['sh', '-c', 'alembic -c /app/testocando/alembic.ini upgrade head && exec uvicorn command.main:app --host 0.0.0.0 --port 8000']
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./testocando:/app/testocando:ro
      - ./backend/alembic:/app/backend/alembic:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  hazard-worker:
    build:
      context: ./backend
    profiles: ['hazards']
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-evacuaid}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-evacuaid}
      REDIS_URL: redis://redis:6379/0
    command: ['python', '-m', 'app.hazardCli', 'refresh', '--loop']
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data
    depends_on:
      backend:
        condition: service_healthy

  offline-worker:
    build:
      context: ./backend
    profiles: ['offline']
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-evacuaid}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-evacuaid}
      OFFLINE_SIGNING_KEY_PATH: /run/secrets/offline-signing.pem
      OFFLINE_ASSET_CATALOG: /app/data/offline-assets/catalog.json
    command: ['python', '-m', 'app.offlineCli', 'worker']
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data
      - ./.secrets:/run/secrets:ro
      - valhalla_tiles:/app/offline-graph:ro
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evacuaid}
      POSTGRES_USER: ${POSTGRES_USER:-evacuaid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  valhalla:
    image: ghcr.io/valhalla/valhalla:3.9.0
    profiles: ['routing']
    command: ['sh', '-c', 'valhalla_build_config --mjolnir-tile-dir /data/valhalla --mjolnir-tile-extract /data/valhalla/tiles.tar > /tmp/valhalla.json && exec valhalla_service /tmp/valhalla.json 1']
    volumes:
      - valhalla_tiles:/data/valhalla:ro
    healthcheck:
      test: ['CMD', 'sh', '-c', 'wget -qO- http://localhost:8002/status >/dev/null']
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  valhalla_tiles:
