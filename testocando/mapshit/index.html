<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Valhalla Route Sandbox</title>
  <link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 900px; background: #071b2b; color: #e7f0f7; font: 14px Inter, Arial, sans-serif; }
    #app { display: grid; grid-template-columns: 330px 1fr; height: 100vh; }
    aside { padding: 28px 22px; background: #0d2a3b; border-right: 1px solid #24465a; }
    h1 { margin: 0 0 8px; font-size: 25px; }
    p { color: #aac1cf; line-height: 1.5; }
    .toolbar { display: grid; gap: 9px; margin: 24px 0; }
    button { padding: 12px; border: 1px solid #315e75; border-radius: 8px; background: #12384d; color: #e7f0f7; cursor: pointer; font: inherit; text-align: left; }
    button:hover, button.active { background: #1d5a73; border-color: #60c6e8; }
    button.route { background: #15a36e; border-color: #39d79b; font-weight: 700; text-align: center; }
    button.reset { background: #592d3b; border-color: #9b4d61; text-align: center; }
    #status, #weather { margin-top: 18px; padding: 14px; border-radius: 8px; background: #092130; color: #b9d2df; line-height: 1.5; }
    #status.error { background: #4b2027; color: #ffc2c9; }
    #status.warning { background: #514014; color: #ffe7a0; }
    #map { height: 100vh; }
    .legend { display: grid; gap: 7px; margin-top: 20px; color: #bfd2dd; }
    .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 8px; }
    .origin { background: #4bb5ff; }
    .safeHouse { background: #22cf87; }
    .disaster { background: #ff4d5c; }
  </style>
</head>
<body>
  <main id='app'>
    <aside>
      <h1>Valhalla Route Sandbox</h1>
      <p>Place an origin and candidate destination. EvacuAid scores route distance, time, hazard exposure, and accessibility uncertainty.</p>
      <div class='toolbar'>
        <button data-mode='origin'>Place origin</button>
        <button data-mode='safeHouse'>Place candidate destination</button>
        <button data-mode='disaster'>Place disaster</button>
        <button id='liveDataButton'>Load live BMKG and PetaBencana</button>
        <button class='route' id='routeButton'>Evaluate destination</button>
        <button class='reset' id='resetButton'>Reset markers</button>
      </div>
      <div class='legend'>
        <span><i class='dot origin'></i>Origin</span>
        <span><i class='dot safeHouse'></i>Unverified destination</span>
        <span><i class='dot disaster'></i>Scenario hazard</span>
      </div>
      <div id='status'>Choose a placement mode, then click the map.</div>
      <div id='weather'>BMKG weather has not been loaded.</div>
    </aside>
    <div id='map'></div>
  </main>
  <script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
  <script>
    const map = L.map('map').setView([-6.1754, 106.8272], 13)
    const state = { mode: 'origin', origin: null, safeHouse: null, disaster: null, routeLayer: null, reportsLayer: L.layerGroup().addTo(map) }
    const markerColors = { origin: '#4bb5ff', safeHouse: '#22cf87', disaster: '#ff4d5c' }
    const markers = {}
    const statusElement = document.getElementById('status')

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map)

    function setStatus(message, type = '') {
      statusElement.textContent = message
      statusElement.className = type
    }

    function setMode(mode) {
      state.mode = mode
      document.querySelectorAll('[data-mode]').forEach((button) => button.classList.toggle('active', button.dataset.mode === mode))
      setStatus(`Click the map to place the ${mode === 'safeHouse' ? 'candidate destination' : mode}.`)
    }

    function markerIcon(type) {
      return L.divIcon({
        className: '',
        html: `<div style='width:22px;height:22px;border:3px solid white;border-radius:50%;background:${markerColors[type]};box-shadow:0 1px 8px #00111d'></div>`,
        iconSize: [22, 22],
        iconAnchor: [11, 11]
      })
    }

    function placeMarker(type, latLng) {
      state[type] = latLng
      if (markers[type]) markers[type].remove()
      markers[type] = L.marker(latLng, { icon: markerIcon(type) }).addTo(map).bindTooltip(type === 'safeHouse' ? 'Unverified destination' : type)
      setStatus(`${type === 'safeHouse' ? 'Candidate destination' : type} placed at ${latLng.lat.toFixed(5)}, ${latLng.lng.toFixed(5)}.`)
    }

    function formatTime(value) {
      return value ? new Date(value).toLocaleString() : 'not available'
    }

    function escapeHtml(value) {
      const element = document.createElement('div')
      element.textContent = String(value ?? 'Unknown')
      return element.innerHTML
    }

    function renderWeather(weather, weatherStatus) {
      const forecast = weather?.forecasts?.[0]
      if (!forecast) {
        document.getElementById('weather').textContent = `BMKG data unavailable. Last fetch: ${formatTime(weatherStatus?.fetchedAt)}.`
        return
      }
      document.getElementById('weather').textContent = `BMKG: ${forecast.weather_desc || 'Unknown'} · ${forecast.temperature_c ?? '?'}°C · humidity ${forecast.humidity_pct ?? '?'}% · fetched ${formatTime(weatherStatus.fetchedAt)}`
    }

    function renderReports(reports) {
      state.reportsLayer.clearLayers()
      let count = 0
      reports.forEach((report) => {
        if (!Number.isFinite(report.latitude) || !Number.isFinite(report.longitude)) return
        count += 1
        L.circleMarker([report.latitude, report.longitude], { radius: 7, color: '#ff9f43', fillColor: '#ff5c57', fillOpacity: 0.85, weight: 2 })
          .bindPopup(`<strong>PetaBencana report</strong><br>${escapeHtml(report.disaster_type)}<br>Status: ${escapeHtml(report.status)}<br>Age: ${escapeHtml(report.report_age_minutes)} min<br><small>Supporting evidence, not an authoritative evacuation order.</small>`)
          .addTo(state.reportsLayer)
      })
      return count
    }

    async function loadExternalData() {
      const button = document.getElementById('liveDataButton')
      button.disabled = true
      setStatus('Fetching BMKG and PetaBencana, then persisting the latest map snapshot...')
      try {
        const response = await fetch('/api/external/sync?adm4=31.71.03.1001', { method: 'POST' })
        const data = await response.json()
        if (!response.ok) throw new Error(data.error || 'External data sync failed.')
        const count = renderReports(data.reports || [])
        renderWeather(data.weather, data.weatherStatus)
        const reportMessage = data.reportsStatus.available ? `${count} persisted PetaBencana reports` : `PetaBencana unavailable: ${data.reportsStatus.error}`
        setStatus(`${reportMessage}. BMKG snapshot: ${data.weatherStatus.available ? 'available' : data.weatherStatus.error || 'unavailable'}.`)
      } catch (error) {
        setStatus(`${error.message} Is the EvacuAid backend running on port 8000?`, 'error')
      } finally {
        button.disabled = false
      }
    }

    async function requestRoute() {
      if (!state.origin || !state.safeHouse) {
        setStatus('Place both an origin and a safe house first.', 'error')
        return
      }
      setStatus('EvacuAid is evaluating the destination with Valhalla, persisted PetaBencana evidence, and accessibility uncertainty...')
      try {
        const response = await fetch('/api/navigation/preview', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            originLatitude: state.origin.lat,
            originLongitude: state.origin.lng,
            destinationLatitude: state.safeHouse.lat,
            destinationLongitude: state.safeHouse.lng,
            scenarioHazards: state.disaster ? [{ latitude: state.disaster.lat, longitude: state.disaster.lng }] : []
          })
        })
        const data = await response.json()
        if (!response.ok || data.routeStatus !== 'READY') throw new Error(data.error || data.selectionReasonCodes?.join(', ') || 'EvacuAid could not evaluate a route.')
        const coordinates = data.route.geometry.coordinates
        if (state.routeLayer) state.routeLayer.remove()
        const exposed = data.evaluation.safetyStatus === 'POTENTIALLY_EXPOSED'
        state.routeLayer = L.polyline(coordinates.map(([longitude, latitude]) => [latitude, longitude]), { color: exposed ? '#ff4d5c' : '#f4b942', weight: 6, opacity: 0.85 }).addTo(map)
        map.fitBounds(state.routeLayer.getBounds(), { padding: [48, 48] })
        const route = data.route
        const closestHazard = data.evaluation.closestHazardDistanceM === null ? 'no geolocated report' : `${Math.round(data.evaluation.closestHazardDistanceM)} m`
        setStatus(`${Math.round(route.distanceM)} m · ${Math.round(route.durationSec / 60)} min · score ${Math.round(route.routeScore)} · ${data.evaluation.safetyStatus} · closest hazard ${closestHazard} · destination is unverified`, exposed ? 'warning' : '')
      } catch (error) {
        setStatus(`${error.message} Is EvacuAid and Valhalla running?`, 'error')
      }
    }

    function decodePolyline(shape) {
      const coordinates = []
      let index = 0
      let latitude = 0
      let longitude = 0
      while (index < shape.length) {
        const values = []
        for (let valueIndex = 0; valueIndex < 2; valueIndex += 1) {
          let shift = 0
          let value = 0
          let encoded
          do {
            encoded = shape.charCodeAt(index) - 63
            index += 1
            value |= (encoded & 31) << shift
            shift += 5
          } while (encoded >= 32)
          values.push(value & 1 ? ~(value >> 1) : value >> 1)
        }
        latitude += values[0]
        longitude += values[1]
        coordinates.push([longitude / 1000000, latitude / 1000000])
      }
      return coordinates
    }

    document.querySelectorAll('[data-mode]').forEach((button) => button.addEventListener('click', () => setMode(button.dataset.mode)))
    document.getElementById('routeButton').addEventListener('click', requestRoute)
    document.getElementById('liveDataButton').addEventListener('click', loadExternalData)
    document.getElementById('resetButton').addEventListener('click', () => {
      Object.values(markers).forEach((marker) => marker.remove())
      Object.keys(markers).forEach((key) => delete markers[key])
      if (state.routeLayer) state.routeLayer.remove()
      Object.assign(state, { origin: null, safeHouse: null, disaster: null, routeLayer: null })
      setStatus('Markers cleared. Choose a placement mode, then click the map.')
    })
    map.on('click', (event) => placeMarker(state.mode, event.latlng))
    setMode('origin')
    loadExternalData()
  </script>
</body>
</html>
